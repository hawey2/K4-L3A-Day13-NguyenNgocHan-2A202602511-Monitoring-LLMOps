alerts:
  - name: high_latency_p95
    severity: critical
    condition: 'percentile(latency_ms, 95) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: warning
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 2m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: retrieval_failure_spike
    severity: warning
    condition: 'count(tool_success == false) / count(tool_success != null) * 100 > 10'
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-3
